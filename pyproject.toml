[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "necli"
version = "1.0.0"
description = "API-first terminal AI agent with interactive and headless modes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "neuralguy" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "click>=8.1",
    "ddgs>=9.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "prompt-toolkit>=3.0.47",
    "pylatexenc>=2.10",
    "rich>=13.7",
    "tiktoken>=0.7",
    "trafilatura>=1.12",
    "wcwidth>=0.2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
necli = "main:cli"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["_frontmatter", "logger", "main", "models", "planner", "system_prompt"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "agent*",
    "apis*",
    "commands*",
    "config*",
    "docx_engine*",
    "hooks*",
    "memory*",
    "pptx_engine*",
    "session*",
    "skills*",
    "tools*",
    "ui*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "ISC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "RUF012"]
"tests/conftest.py" = ["E402"]
"src/docx_engine/__init__.py" = ["E402"]
"src/skills/manager.py" = ["E402"]
"src/ui/shell.py" = ["E402"]
